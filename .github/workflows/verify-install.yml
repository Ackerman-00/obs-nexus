name: Nexus Install Verification (RPM + DEB)

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space separated package names (empty = rotating slice)'
        required: false
        default: ''
  workflow_run:
    workflows: ["Nexus Auto-Updater (OBS Pipeline)"]
    types: [completed]

concurrency:
  group: install-verification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      deb_matrix: ${{ steps.pick.outputs.deb_matrix }}
      rpm_matrix: ${{ steps.pick.outputs.rpm_matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Pick the rotation slice
        id: pick
        run: |
          python3 - "${{ github.event.inputs.packages }}" <<'PY'
          import glob, json, os, re, sys
          explicit = (sys.argv[1] if len(sys.argv) > 1 else "").split()
          specs = sorted(os.path.dirname(p) for p in glob.glob("*/*.spec"))
          dsc = set(os.path.dirname(p) for p in glob.glob("*/*.dsc"))

          probes = {}
          if os.path.exists("tools/probes.txt"):
              for line in open("tools/probes.txt", encoding="utf-8"):
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  parts = line.split("|")
                  if len(parts) >= 3:
                      probes[parts[0]] = (parts[1].strip(), parts[2].strip())

          def rpm_name(pkg):
              return probes.get(pkg, (pkg, pkg))[0] or pkg

          def deb_binary(pkg):
              if pkg in probes and probes[pkg][1]:
                  return probes[pkg][1]
              path = os.path.join(pkg, pkg + ".dsc")
              if os.path.exists(path):
                  text = open(path, encoding="utf-8", errors="replace").read()
                  m = re.search(r"^Binary:\s*(\S+)", text, re.M)
                  if m:
                      return m.group(1)
              return pkg

          shards = 6
          day = int(os.environ.get("DAY_OF_YEAR", "1"))
          out = {}
          if explicit:
              deb = [p for p in explicit if p in dsc]
              rpm = [p for p in explicit]
          else:
              deb = [p for p in specs if p in dsc]
              deb = [p for i, p in enumerate(deb) if i % shards == day % shards]
              rpm = [p for i, p in enumerate(specs) if i % shards == day % shards]
          out["deb_matrix"] = json.dumps([{"dir": p, "bin": deb_binary(p)} for p in deb])
          out["rpm_matrix"] = json.dumps([{"dir": p, "bin": rpm_name(p)} for p in rpm])
          for k, v in out.items():
              print(f"{k}={v}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write(f"{k}={v}\n")
          PY
        env:
          DAY_OF_YEAR: ${{ github.run_number }}

  rpm:
    needs: select
    if: needs.select.outputs.rpm_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: ${{ fromJson(needs.select.outputs.rpm_matrix) }}
    steps:
      - name: Install from the published Tumbleweed repository
        env:
          PKG: ${{ matrix.package.bin }}
          DIR: ${{ matrix.package.dir }}
        run: |
          docker run --rm -e PKG="$PKG" registry.opensuse.org/opensuse/tumbleweed:latest bash -lc '
            set -u
            zypper --non-interactive --gpg-auto-import-keys addrepo --refresh https://download.opensuse.org/tumbleweed/repo/oss/ oss >/dev/null 2>&1
            zypper --non-interactive --gpg-auto-import-keys addrepo --refresh https://download.opensuse.org/repositories/home:ackerman/openSUSE_Tumbleweed/ nexus >/dev/null 2>&1
            repo_ok=0
            for attempt in 1 2 3; do
              zypper --non-interactive --gpg-auto-import-keys refresh >/tmp/r.log 2>&1 && repo_ok=1 && break
              sleep 3
            done
            if [ "$repo_ok" != 1 ]; then
              zypper --non-interactive removerepo repo-oss repo-update repo-non-oss >/dev/null 2>&1
              zypper --non-interactive --gpg-auto-import-keys addrepo --refresh https://ftp.halifax.rwth-aachen.de/opensuse/tumbleweed/repo/oss/ oss-mirror >/dev/null 2>&1
              zypper --non-interactive --gpg-auto-import-keys refresh >/tmp/r.log 2>&1 || { echo "repo refresh failed"; tail -5 /tmp/r.log; exit 1; }
              echo "distro_repo=halifax-fallback"
            fi
            zypper --non-interactive install --no-recommends "$PKG" || exit 1
            rpm -q "$PKG"
            n=$(find /opt /usr/share /usr/lib -maxdepth 6 \( -name app-update.yml -o -name package-type \) 2>/dev/null | wc -l)
            echo "updater_markers=$n"
            [ "$n" -eq 0 ] || { echo "in-app updater markers shipped: $n"; exit 1; }
            s=0
            for f in $(find /opt -maxdepth 6 -name install-stamp.json 2>/dev/null); do
              grep -q "updateMechanism" "$f" || continue
              grep -qE "updateMechanism\"[[:space:]]*:[[:space:]]*\"external\"" "$f" && continue
              echo "self-updating stamp shipped in $f"; s=$((s + 1))
            done
            echo "self_update_stamps=$s"
            [ "$s" -eq 0 ] || exit 1
          '

  deb:
    needs: select
    if: needs.select.outputs.deb_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: ${{ fromJson(needs.select.outputs.deb_matrix) }}
        suite: [testing, sid]
    steps:
      - name: Install from the published Debian repository
        env:
          SUITE: ${{ matrix.suite }}
          PKG: ${{ matrix.package.bin }}
          DIR: ${{ matrix.package.dir }}
        run: |
          if [ "$SUITE" = "testing" ]; then REPO=Debian_Testing; else REPO=Debian_Unstable; fi
          docker run --rm -e PKG="$PKG" -e REPO="$REPO" "debian:$SUITE" bash -lc '
            set -u
            apt-get update -qq
            apt-get install -y -qq ca-certificates curl gnupg
            mkdir -p /etc/apt/keyrings
            curl -fsSL "https://download.opensuse.org/repositories/home:ackerman/$REPO/Release.key" | gpg --dearmor > /etc/apt/keyrings/obs-nexus.gpg
            echo "deb [signed-by=/etc/apt/keyrings/obs-nexus.gpg] https://download.opensuse.org/repositories/home:ackerman/$REPO/ /" > /etc/apt/sources.list.d/nexus.list
            apt-get update -qq
            apt-get install -y --no-install-recommends "$PKG"
            dpkg -s "$PKG" | grep -E "^(Status|Version)"
            apt-cache policy "$PKG" | grep -q download.opensuse.org || { echo "installed from the wrong repository"; exit 1; }
            n=$(find /opt /usr/share /usr/lib -maxdepth 6 \( -name app-update.yml -o -name package-type \) 2>/dev/null | wc -l)
            echo "updater_markers=$n"
            [ "$n" -eq 0 ] || { echo "in-app updater markers shipped: $n"; exit 1; }
            s=0
            for f in $(find /opt -maxdepth 6 -name install-stamp.json 2>/dev/null); do
              grep -q "updateMechanism" "$f" || continue
              grep -qE "updateMechanism\"[[:space:]]*:[[:space:]]*\"external\"" "$f" && continue
              echo "self-updating stamp shipped in $f"; s=$((s + 1))
            done
            echo "self_update_stamps=$s"
            [ "$s" -eq 0 ] || exit 1
          '
