name: Nexus Auto-Updater (OBS Pipeline)

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours
  workflow_dispatch:

concurrency:
  group: obs-source-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-packages:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils jq curl

      - name: Install Rust toolchain (for cargo vendor)
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Run Modular Updaters
        id: updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "==> Phase 1: Running Custom Modules (update.sh)..."
          for script in $(find . -mindepth 2 -name "update.sh"); do
            dir=$(dirname "$script")
            pushd "$dir" > /dev/null
            if ! bash update.sh; then
              echo "::warning::update.sh failed in $dir - continuing with the next package"
            fi
            popd > /dev/null
          done

          echo ""
          echo "==> Phase 2: Scanning Standard Packages via GitHub API..."
          python3 << 'EOF'
          import os, re, requests
          from pathlib import Path

          gh_token = os.environ.get('GITHUB_TOKEN')
          headers = {'Accept': 'application/vnd.github.v3+json'}
          if gh_token: headers['Authorization'] = f'token {gh_token}'

          for spec in Path('.').rglob('*.spec'):
              if (spec.parent / 'update.sh').exists():
                  continue
                  
              print(f"Scanning {spec.name}...")
              content = spec.read_text(encoding='utf-8')
              
              repo_match = re.search(r'https://github\.com/([^/\n\s"\']+)/([^/\n\s"\']+)', content, re.IGNORECASE)
              version_match = re.search(r'^Version:\s*([0-9a-zA-Z.-]+)', content, re.MULTILINE)
              tag_match = re.search(r'%global\s+tag\s+(.+)', content)
              
              if not repo_match: 
                  print(f"  -> No GitHub URL found. Skipping.")
                  continue
                  
              owner, repo = repo_match.group(1), repo_match.group(2)
              repo = re.sub(r'(\.git|/archive|/releases)$', '', repo, flags=re.IGNORECASE)

              current_ver = version_match.group(1).strip() if version_match else None
              current_tag = tag_match.group(1).strip() if tag_match else None

              try:
                  api_url = f"https://api.github.com/repos/{owner}/{repo}/releases/latest"
                  res = requests.get(api_url, headers=headers, timeout=10)
                  if res.status_code == 200:
                      latest_tag = res.json().get('tag_name', '')
                      latest_ver = latest_tag.lstrip('v')
                      
                      new_content = content
                      changed = False
                      
                      if current_tag:
                          if latest_tag != current_tag:
                              new_content = re.sub(r'(%global\s+tag\s+).+', rf'\g<1>{latest_tag}', new_content)
                              changed = True
                              print(f"  -> [UPDATE] {repo} changed from {current_tag} to {latest_tag}!")
                          else:
                              print(f"  -> [OK] {repo} is already on latest ({current_tag}).")
                      elif current_ver:
                          if latest_ver != current_ver:
                              new_content = re.sub(r'(^Version:\s+).+', rf'\g<1>{latest_ver}', new_content, flags=re.MULTILINE)
                              changed = True
                              print(f"  -> [UPDATE] {repo} changed from {current_ver} to {latest_ver}!")
                          else:
                              print(f"  -> [OK] {repo} is already on latest ({current_ver}).")
                          
                      if changed:
                          spec.write_text(new_content, encoding='utf-8')
                  else:
                      print(f"  -> [ERROR] GitHub API returned {res.status_code}")
              except Exception as e:
                  print(f"  -> [ERROR] {e}")
          EOF

          if ! git diff --quiet; then
            echo "updates_made=true" >> $GITHUB_OUTPUT
            git diff --name-only > .git_modified_files.txt
            echo "Files modified:"
            cat .git_modified_files.txt
          else
            echo "updates_made=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate recipe consistency (Debian .dsc)
        run: |
          python3 << 'EOF'
          import re, sys
          from pathlib import Path
          bad = []
          for dsc in sorted(Path('.').glob('*/*.dsc')):
              txt = dsc.read_text(encoding='utf-8')
              v = re.search(r'^Version:\s*(\S+)', txt, re.M)
              t = re.search(r'^Debtransform-Tar:\s*(\S+)', txt, re.M)
              if not v or not t:
                  bad.append(f'{dsc}: missing Version/Debtransform-Tar')
                  continue
              v, t = v.group(1), t.group(1)
              spec = dsc.with_suffix('.spec')
              if not spec.exists():
                  bad.append(f'{dsc}: no sibling spec')
                  continue
              stxt = spec.read_text(encoding='utf-8')
              sv = re.search(r'^Version:\s*(\S+)', stxt, re.M).group(1)
              if '%' in sv:
                  m = re.search(r'%global\s+base_version\s+(\S+)', stxt)
                  ver_ok = v.startswith(m.group(1)) if m else False
              else:
                  ver_ok = (v == sv)
              sc = re.search(r'%global\s+shortcommit\s+(\S+)', stxt)
              tar_ok = (v in t) or (sc and sc.group(1) in t)
              if not t.endswith(('.tar.gz', '.tar.xz', '.tar.bz2', '.tar.zst')):
                  bad.append(f'{dsc}: Debtransform-Tar {t} is not a compressed tarball (debian transforming fails on plain .tar)')
              if not ver_ok:
                  bad.append(f'{dsc}: dsc Version {v} != spec Version {sv}')
              if not tar_ok:
                  bad.append(f'{dsc}: Debtransform-Tar {t} embeds neither {v} nor shortcommit')
          if bad:
              print('RECIPE MISMATCH:')
              print('\n'.join(f'  - {b}' for b in bad))
              sys.exit(1)
          print('Debian recipes consistent.')
          EOF

      - name: Validate payload file references (AppImage repacks)
        run: |
          python3 << 'EOF'
          import glob, os, re, subprocess, sys, tempfile
          from pathlib import Path
          missing, skipped = [], []
          for spec in sorted(Path('.').glob('*/*.spec')):
              pkgdir = spec.parent
              rules = pkgdir / 'debian.rules'
              if not rules.exists():
                  continue
              refs = set(re.findall(r'(?:squashfs-root|appimage-root)/[A-Za-z0-9._-]+',
                                    spec.read_text(encoding='utf-8') + rules.read_text(encoding='utf-8')))
              if not refs:
                  continue
              imgs = sorted(pkgdir.glob('*.AppImage'))
              if not imgs:
                  skipped.append(pkgdir.name)
                  continue
              with tempfile.TemporaryDirectory() as td:
                  img = str(imgs[0].resolve())
                  os.chmod(img, 0o755)
                  r = subprocess.run([img, '--appimage-extract'], cwd=td, capture_output=True)
                  if r.returncode != 0:
                      missing.append(f'{pkgdir.name}: AppImage extraction failed')
                      continue
                  for ref in sorted(refs):
                      rel = 'squashfs-root/' + ref.split('/', 1)[1]
                      if not (Path(td) / rel).exists():
                          missing.append(f'{pkgdir.name}: {ref} not in payload')
          if skipped:
              print('payload-ref SKIP (no local AppImage): ' + ', '.join(skipped))
          if missing:
              print('PAYLOAD REF MISMATCH:')
              print('\n'.join(f'  - {b}' for b in missing))
              sys.exit(1)
          print('Payload file references consistent.')
          EOF

      - name: Commit and Push
        if: steps.updater.outputs.updates_made == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "auto-update: sync spec files to latest upstream versions"
          git fetch origin
          git pull --rebase origin main
          git push

      - name: Check OBS Build Status
        id: obs_check
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASS: ${{ secrets.OBS_PASS }}
        run: |
          echo "==> Phase 3: Checking OBS Build Status..."
          RESULT=""
          for attempt in 1 2 3 4 5; do
            RESULT=$(curl -s -S -u "$OBS_USER:$OBS_PASS" -G "https://api.opensuse.org/build/home:ackerman/_result" \
              --data-urlencode "view=status" \
              --data-urlencode "code=failed" \
              --data-urlencode "code=broken" \
              --data-urlencode "code=unresolvable")
            if ! echo "$RESULT" | grep -q '<html'; then
              break
            fi
            echo "OBS API attempt $attempt returned HTML (transient error); retrying in 30s..."
            echo "$RESULT" | grep -oP '<title>[^<]+</title>' | head -1 || true
            sleep 30
          done
          if echo "$RESULT" | grep -q '<html'; then
            echo "ERROR: OBS API returned non-XML response after 5 attempts (auth failure or outage?)"
            echo "$RESULT" | grep -oP '<title>[^<]+</title>' | head -1
            exit 1
          fi
          echo "$RESULT" | grep -oP 'package="[^"]+"' | grep -oP '"[^"]+"' | tr -d '"' | sort -u > .rebuild_packages.txt
          if [ -s .rebuild_packages.txt ]; then
            echo "rebuild_needed=true" >> $GITHUB_OUTPUT
            echo "Packages needing rebuild:"
            cat .rebuild_packages.txt
          else
            echo "rebuild_needed=false" >> $GITHUB_OUTPUT
            echo "All packages build successfully."
          fi

      - name: Smart Sync to OBS
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASS: ${{ secrets.OBS_PASS }}
        run: |
          echo "==> 🚀 Syncing packages to OBS..."

          collect_pkgs() {
            PKGS=""
            if [ -f .git_modified_files.txt ]; then
              PKGS="$PKGS $(grep '/' .git_modified_files.txt | cut -d/ -f1 | sort -u)"
            fi
            if [ -f .rebuild_packages.txt ]; then
              PKGS="$PKGS $(cat .rebuild_packages.txt)"
            fi
            echo "$PKGS" | tr ' ' '\n' | sort -u
          }

          obs_mutate() {
            local method="$1" url="$2"; shift 2
            local code="" attempt
            for attempt in 1 2 3 4 5; do
              code=$(curl -sS -X "$method" -o /tmp/obs_mutate_resp.$$ -w "%{http_code}" \
                -u "$OBS_USER:$OBS_PASS" "$@" "$url" || :)
              if [ "$method" = "DELETE" ] && [ "$code" = "404" ]; then
                rm -f /tmp/obs_mutate_resp.$$
                return 0
              fi
              case "$code" in
                2??) rm -f /tmp/obs_mutate_resp.$$; return 0 ;;
              esac
              echo "    OBS $method -> HTTP ${code:-000} (attempt $attempt)"
              sleep 15
            done
            echo "    ERROR: OBS $method $url failed after 5 attempts (last HTTP ${code:-000}). Response:"
            head -c 400 /tmp/obs_mutate_resp.$$ 2>/dev/null || true
            echo
            rm -f /tmp/obs_mutate_resp.$$
            return 1
          }

          ensure_package() {
            local pkg="$1"
            if curl -s -u "$OBS_USER:$OBS_PASS" \
                 "https://api.opensuse.org/source/home:ackerman/$pkg" | grep -q 'unknown_package'; then
              echo " -> Creating package $pkg in OBS..."
              obs_mutate PUT "https://api.opensuse.org/source/home:ackerman/$pkg/_meta" \
                -H "Content-Type: application/xml" \
                --data-binary "<package name=\"$pkg\" project=\"home:ackerman\"><title>$pkg</title><description>Automatically synced from opensuse-nexus.</description></package>" \
                || { echo "ERROR: could not create package $pkg in OBS"; exit 1; }
            fi
          }

          trigger_build() {
            local pkg="$1"
            if [ -f "$pkg/_service" ]; then
              echo " -> Running services for: $pkg"
              obs_mutate POST "https://api.opensuse.org/source/home:ackerman/$pkg?cmd=runservice" \
                || { echo "ERROR: runservice failed for $pkg"; exit 1; }
            else
              echo " -> Triggering rebuild for: $pkg"
              obs_mutate POST "https://api.opensuse.org/source/home:ackerman/$pkg?cmd=rebuild" \
                || { echo "ERROR: rebuild trigger failed for $pkg"; exit 1; }
            fi
          }

          sync_files() {
            local pkg="$1"
            ensure_package "$pkg"

            OBS_FILES=$(curl -s -u "$OBS_USER:$OBS_PASS" "https://api.opensuse.org/source/home:ackerman/$pkg" | grep -oP '(?<=<entry name=")[^"]+' || true)

            local filepath filename phase
            for phase in payload other spec; do
              while IFS= read -r filepath; do
                filename=$(basename "$filepath")
                case "$phase" in
                  payload)
                    case "$filename" in
                      *.tar.gz|*.tar.xz|*.tar.bz2|*.tar.zst|*.rpm|*.AppImage|*.deb|cargo_config|vendor*) ;;
                      *) continue ;;
                    esac ;;
                  other)
                    case "$filename" in
                      *.spec|*.tar.gz|*.tar.xz|*.tar.bz2|*.tar.zst|*.rpm|*.AppImage|*.deb|cargo_config|vendor*) continue ;;
                    esac ;;
                  spec)
                    case "$filename" in
                      *.spec) ;;
                      *) continue ;;
                    esac ;;
                esac
                echo "    Uploading $filename to OBS..."
                obs_mutate PUT "https://api.opensuse.org/source/home:ackerman/$pkg/$filename" -T "$filepath" \
                  || { echo "ERROR: upload of $pkg/$filename failed; OBS left as-is, next run's drift sync retries (job red on purpose)."; exit 1; }
              done < <(find "$pkg" -maxdepth 1 -type f ! -name "update.sh" ! -name ".*")
            done

            for remote_file in $OBS_FILES; do
              regen=0
              if [ -f "$pkg/_service" ]; then
                total=$(grep -c '<service ' "$pkg/_service" || true)
                disabled=$(grep -c 'mode="disabled"' "$pkg/_service" || true)
                if [ "${total:-0}" -gt "${disabled:-0}" ]; then
                  regen=1
                fi
              fi
              if [ "$regen" != "1" ]; then
                case "$remote_file" in
                  *.tar.gz|*.tar.xz|*.tar.bz2|*.tar.zst|cargo_config|vendor*|*.rpm|*.AppImage|*.deb|*.keyring)
                    if [ ! -f "$pkg/$remote_file" ]; then
                      echo "    Keeping remote source artifact (no local copy to re-upload): $remote_file"
                      continue
                    fi
                    ;;
                esac
              fi
              # regen=1 only means an enabled _service EXISTS, not that it can
              # rebuild every artifact: Debtransform wrapper tarballs named by
              # <pkg>.dsc are assembled locally by update.sh (download_files
              # only fetches spec Source URLs). 2026-10-27 freebuff-desktop:
              # a fresh checkout had no wrapper, the delete ran because
              # download_files was enabled, and all 3 targets failed in
              # debtransform. Keep the only copy; update.sh's ensure-artifact
              # branch re-uploads the fresh one on the next run.
              dsc_file=$(ls "$pkg"/*.dsc 2>/dev/null | head -1)
              if [ -n "$dsc_file" ] && grep -qE "^Debtransform-Tar:[[:space:]]*$remote_file[[:space:]]*$" "$dsc_file" \
                 && [ ! -f "$pkg/$remote_file" ]; then
                echo "    Keeping Debtransform-Tar named by $(basename "$dsc_file") (no local copy): $remote_file"
                continue
              fi
              if [ ! -f "$pkg/$remote_file" ] || [ "$remote_file" == "update.sh" ]; then
                echo "    Deleting obsolete file from OBS: $remote_file"
                obs_mutate DELETE "https://api.opensuse.org/source/home:ackerman/$pkg/$remote_file" \
                  || { echo "ERROR: delete of $pkg/$remote_file failed (stale weight only, retried next run)."; exit 1; }
              fi
            done

            trigger_build "$pkg"
          }

          PKGS_TO_SYNC=$(collect_pkgs)

          echo "==> Checking repo-vs-OBS drift for tracked files..."
          expand_spec_macro() {
            local spec="$1" val="$2" macro mval out
            macro=$(printf '%s' "$val" | grep -oP '%\{[a-zA-Z_][a-zA-Z0-9_]*\}|%[a-zA-Z_][a-zA-Z0-9_]*' | head -1 | tr -d '%{}') || true
            [ -n "$macro" ] || { printf '%s' "$val"; return; }
            mval=$(grep -oP "^%(?:global|define)\s+${macro}\s+\K\S+" "$spec" | head -1)
            if [ -z "$mval" ] && [ "${macro,,}" = "version" ]; then
              mval=$(grep -oP '^Version:[ \t]*\K\S+' "$spec" | head -1)
            fi
            if [ -n "$mval" ]; then
              out=$(printf '%s' "$val" | sed "s/%{${macro}}/${mval}/g; s/%${macro}/${mval}/g")
              printf '%s' "$out"
            else
              printf '%s' ""
            fi
          }
          for pkg_dir in */; do
            pkg="${pkg_dir%/}"
            ls "$pkg_dir"*.spec >/dev/null 2>&1 || continue
            spec_file=$(ls "$pkg_dir"*.spec | head -1)
            OBS_XML=$(curl -s -u "$OBS_USER:$OBS_PASS" "https://api.opensuse.org/source/home:ackerman/$pkg" || true)
            if echo "$OBS_XML" | grep -q 'unknown_package'; then
              PKGS_TO_SYNC="$PKGS_TO_SYNC $pkg"
              continue
            fi
            DRIFT=0
            while IFS= read -r filepath; do
              filename=$(basename "$filepath")
              [ "$filename" = "update.sh" ] && continue
              LOCAL_MD5=$(md5sum "$filepath" | cut -d' ' -f1)
              REMOTE_MD5=$(echo "$OBS_XML" | grep -oP "(?<=<entry name=\"$filename\" md5=\")[0-9a-f]{32}" | head -1 || true)
              if [ "$LOCAL_MD5" != "$REMOTE_MD5" ]; then
                echo " -> Drift on $pkg/$filename (local=$LOCAL_MD5 obs=${REMOTE_MD5:-missing})"
                DRIFT=1
                break
              fi
            done < <(git ls-files "$pkg")
            if [ "$DRIFT" != "1" ]; then
              continue
            fi
            if [ ! -f "$pkg/_service" ]; then
              ART_OK=1
              while IFS= read -r srcline; do
                srcval=$(printf '%s' "$srcline" | sed 's/^[[:space:]]*Source[0-9]*:[[:space:]]*//')
                for _ in 1 2 3 4; do
                  expanded=$(expand_spec_macro "$spec_file" "$srcval")
                  [ -n "$expanded" ] || break
                  [ "$expanded" = "$srcval" ] && break
                  srcval="$expanded"
                done
                base=$(basename "$srcval")
                if [ -n "$base" ] && [ ! -f "$pkg/$base" ]; then
                  echo " -> $pkg: source artifact '$base' not in local tree; deferring drift-sync"
                  ART_OK=0
                  break
                fi
              done < <(grep -E '^[[:space:]]*Source[0-9]*:' "$spec_file")
              if [ "$ART_OK" != "1" ]; then
                continue
              fi
            fi
            PKGS_TO_SYNC="$PKGS_TO_SYNC $pkg"
          done

          for pkg in $(printf '%s\n' $PKGS_TO_SYNC | sort -u); do
            if [ -z "$pkg" ] || [ ! -d "$pkg" ]; then
              continue
            fi
            echo " -> Syncing package: $pkg"
            sync_files "$pkg"
          done

          OBS_ALL_PKGS=$(curl -s -u "$OBS_USER:$OBS_PASS" "https://api.opensuse.org/source/home:ackerman" | grep -oP '(?<=<entry name=")[^"]+' || true)
          for pkg_dir in */; do
            pkg=$(basename "$pkg_dir")
            if [ ! -f "$pkg_dir"*.spec ] 2>/dev/null; then
              continue
            fi
            if echo "$OBS_ALL_PKGS" | grep -q "^${pkg}$"; then
              OBS_FILES=$(curl -s -u "$OBS_USER:$OBS_PASS" "https://api.opensuse.org/source/home:ackerman/$pkg" | grep -oP '(?<=<entry name=")[^"]+' || true)
              if [ -n "$OBS_FILES" ]; then
                echo " -> OK, package $pkg already synced in OBS"
                continue
              fi
              echo " -> Package $pkg exists in OBS but has no files; re-syncing"
            else
              echo " -> New local package not in OBS: $pkg"
            fi
            sync_files "$pkg"
          done
