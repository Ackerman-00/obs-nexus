name: Nexus Auto-Updater (OBS Pipeline)

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-packages:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils jq curl

      - name: Install Rust toolchain (for cargo vendor)
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - run: pip install requests

      # Gitignored debtransform orig inputs maintained by each package's
      # update.sh (Debian_Testing recipe: <pkg>.dsc + flat debian.* + orig
      # tarball). Per-package caches keep them across fresh checkouts so
      # multi-hundred-MB upstream downloads only happen on real version
      # changes or cache eviction; keys are per-package so one package's
      # bump never invalidates the others.
      - name: Cache Debian orig tarball (fluxer)
        uses: actions/cache@v6.1.0
        with:
          path: fluxer/*.tar
          key: deb-orig-fluxer-${{ hashFiles('fluxer/fluxer.spec', 'fluxer/fluxer.dsc') }}
      - name: Cache Debian orig tarball (helium-browser)
        uses: actions/cache@v6.1.0
        with:
          path: helium-browser/*.tar.xz
          key: deb-orig-helium-${{ hashFiles('helium-browser/helium-browser.spec', 'helium-browser/helium-browser.dsc') }}
      - name: Cache Debian orig tarball (localsend)
        uses: actions/cache@v6.1.0
        with:
          path: localsend/*.tar
          key: deb-orig-localsend-${{ hashFiles('localsend/localsend.spec', 'localsend/localsend.dsc') }}
      - name: Cache Debian orig tarball (obsidian)
        uses: actions/cache@v6.1.0
        with:
          path: obsidian/*.tar
          key: deb-orig-obsidian-${{ hashFiles('obsidian/obsidian.spec', 'obsidian/obsidian.dsc') }}
      - name: Cache Debian orig tarball (opencode-desktop)
        uses: actions/cache@v6.1.0
        with:
          path: opencode-desktop/*.tar
          key: deb-orig-opencode-${{ hashFiles('opencode-desktop/opencode-desktop.spec', 'opencode-desktop/opencode-desktop.dsc') }}
      - name: Cache Debian orig tarball (rootapp)
        uses: actions/cache@v6.1.0
        with:
          path: rootapp/*.tar
          key: deb-orig-rootapp-${{ hashFiles('rootapp/rootapp.spec', 'rootapp/rootapp.dsc') }}
      - name: Cache Debian orig tarball (stoat-desktop)
        uses: actions/cache@v6.1.0
        with:
          path: stoat-desktop/*.tar
          key: deb-orig-stoat-${{ hashFiles('stoat-desktop/stoat-desktop.spec', 'stoat-desktop/stoat-desktop.dsc') }}
      - name: Cache Debian orig tarball (vesktop)
        uses: actions/cache@v6.1.0
        with:
          path: vesktop/*.tar
          key: deb-orig-vesktop-${{ hashFiles('vesktop/vesktop.spec', 'vesktop/vesktop.dsc') }}
      - name: Cache Debian orig tarball (zen-browser)
        uses: actions/cache@v6.1.0
        with:
          path: zen-browser/*.tar.xz
          key: deb-orig-zen-${{ hashFiles('zen-browser/zen-browser.spec', 'zen-browser/zen-browser.dsc') }}

      - name: Run Modular Updaters
        id: updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "==> Phase 1: Running Custom Modules (update.sh)..."
          for script in $(find . -mindepth 2 -name "update.sh"); do
            dir=$(dirname "$script")
            pushd "$dir" > /dev/null
            # A transient upstream/API failure in one updater must NOT abort the
            # whole pipeline (it would skip the OBS build check and sync below).
            if ! bash update.sh; then
              echo "::warning::update.sh failed in $dir - continuing with the next package"
            fi
            popd > /dev/null
          done

          echo ""
          echo "==> Phase 2: Scanning Standard Packages via GitHub API..."
          python3 << 'EOF'
          import os, re, requests
          from pathlib import Path

          gh_token = os.environ.get('GITHUB_TOKEN')
          headers = {'Accept': 'application/vnd.github.v3+json'}
          if gh_token: headers['Authorization'] = f'token {gh_token}'

          for spec in Path('.').rglob('*.spec'):
              if (spec.parent / 'update.sh').exists():
                  continue
                  
              print(f"Scanning {spec.name}...")
              content = spec.read_text(encoding='utf-8')
              
              repo_match = re.search(r'https://github\.com/([^/\n\s"\']+)/([^/\n\s"\']+)', content, re.IGNORECASE)
              version_match = re.search(r'^Version:\s*([0-9a-zA-Z.-]+)', content, re.MULTILINE)
              tag_match = re.search(r'%global\s+tag\s+(.+)', content)
              
              if not repo_match: 
                  print(f"  -> No GitHub URL found. Skipping.")
                  continue
                  
              owner, repo = repo_match.group(1), repo_match.group(2)
              repo = re.sub(r'(\.git|/archive|/releases)$', '', repo, flags=re.IGNORECASE)

              current_ver = version_match.group(1).strip() if version_match else None
              current_tag = tag_match.group(1).strip() if tag_match else None

              try:
                  api_url = f"https://api.github.com/repos/{owner}/{repo}/releases/latest"
                  res = requests.get(api_url, headers=headers, timeout=10)
                  if res.status_code == 200:
                      latest_tag = res.json().get('tag_name', '')
                      latest_ver = latest_tag.lstrip('v')
                      
                      new_content = content
                      changed = False
                      
                      if current_tag:
                          if latest_tag != current_tag:
                              new_content = re.sub(r'(%global\s+tag\s+).+', rf'\g<1>{latest_tag}', new_content)
                              changed = True
                              print(f"  -> [UPDATE] {repo} changed from {current_tag} to {latest_tag}!")
                          else:
                              print(f"  -> [OK] {repo} is already on latest ({current_tag}).")
                      elif current_ver:
                          if latest_ver != current_ver:
                              new_content = re.sub(r'(^Version:\s+).+', rf'\g<1>{latest_ver}', new_content, flags=re.MULTILINE)
                              changed = True
                              print(f"  -> [UPDATE] {repo} changed from {current_ver} to {latest_ver}!")
                          else:
                              print(f"  -> [OK] {repo} is already on latest ({current_ver}).")
                          
                      if changed:
                          spec.write_text(new_content, encoding='utf-8')
                  else:
                      print(f"  -> [ERROR] GitHub API returned {res.status_code}")
              except Exception as e:
                  print(f"  -> [ERROR] {e}")
          EOF

          if ! git diff --quiet; then
            echo "updates_made=true" >> $GITHUB_OUTPUT
            git diff --name-only > .git_modified_files.txt
            echo "Files modified:"
            cat .git_modified_files.txt
          else
            echo "updates_made=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push
        if: steps.updater.outputs.updates_made == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "auto-update: sync spec files to latest upstream versions"
          git push

      - name: Check OBS Build Status
        id: obs_check
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASS: ${{ secrets.OBS_PASS }}
        run: |
          echo "==> Phase 3: Checking OBS Build Status..."
          # The OBS API occasionally returns transient 500s ("Web application
          # could not be started"). Retry before giving up - a false failure
          # here aborts the job and skips the sync phase below.
          RESULT=""
          for attempt in 1 2 3 4 5; do
            RESULT=$(curl -s -S -u "$OBS_USER:$OBS_PASS" -G "https://api.opensuse.org/build/home:ackerman/_result" \
              --data-urlencode "view=status" \
              --data-urlencode "code=failed" \
              --data-urlencode "code=broken" \
              --data-urlencode "code=unresolvable")
            if ! echo "$RESULT" | grep -q '<html'; then
              break
            fi
            echo "OBS API attempt $attempt returned HTML (transient error); retrying in 30s..."
            echo "$RESULT" | grep -oP '<title>[^<]+</title>' | head -1 || true
            sleep 30
          done
          if echo "$RESULT" | grep -q '<html'; then
            echo "ERROR: OBS API returned non-XML response after 5 attempts (auth failure or outage?)"
            echo "$RESULT" | grep -oP '<title>[^<]+</title>' | head -1
            exit 1
          fi
          echo "$RESULT" | grep -oP 'package="[^"]+"' | grep -oP '"[^"]+"' | tr -d '"' | sort -u > .rebuild_packages.txt
          if [ -s .rebuild_packages.txt ]; then
            echo "rebuild_needed=true" >> $GITHUB_OUTPUT
            echo "Packages needing rebuild:"
            cat .rebuild_packages.txt
          else
            echo "rebuild_needed=false" >> $GITHUB_OUTPUT
            echo "All packages build successfully."
          fi

      - name: Smart Sync to OBS
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASS: ${{ secrets.OBS_PASS }}
        run: |
          echo "==> 🚀 Syncing packages to OBS..."

          collect_pkgs() {
            PKGS=""
            if [ -f .git_modified_files.txt ]; then
              PKGS="$PKGS $(grep '/' .git_modified_files.txt | cut -d/ -f1 | sort -u)"
            fi
            if [ -f .rebuild_packages.txt ]; then
              PKGS="$PKGS $(cat .rebuild_packages.txt)"
            fi
            echo "$PKGS" | tr ' ' '\n' | sort -u
          }

          # Create the package in OBS first, otherwise PUT uploads fail with
          # "<status code="unknown_package">". PUT of the _meta file creates
          # the package if it does not exist yet (idempotent).
          ensure_package() {
            local pkg="$1"
            if curl -s -u "$OBS_USER:$OBS_PASS" \
                 "https://api.opensuse.org/source/home:ackerman/$pkg" | grep -q 'unknown_package'; then
              echo " -> Creating package $pkg in OBS..."
              curl -s -X PUT -u "$OBS_USER:$OBS_PASS" -H "Content-Type: application/xml" \
                --data-binary "<package name=\"$pkg\" project=\"home:ackerman\"><title>$pkg</title><description>Automatically synced from opensuse-nexus.</description></package>" \
                "https://api.opensuse.org/source/home:ackerman/$pkg/_meta"
            fi
          }

          # Trigger a rebuild. Packages with a _service need runservice to fetch
          # remote sources first; packages without one just need a plain rebuild.
          trigger_build() {
            local pkg="$1"
            if [ -f "$pkg/_service" ]; then
              echo " -> Running services for: $pkg"
              curl -s -X POST -u "$OBS_USER:$OBS_PASS" \
                "https://api.opensuse.org/source/home:ackerman/$pkg?cmd=runservice"
            else
              echo " -> Triggering rebuild for: $pkg"
              curl -s -X POST -u "$OBS_USER:$OBS_PASS" \
                "https://api.opensuse.org/source/home:ackerman/$pkg?cmd=rebuild"
            fi
          }

          sync_files() {
            local pkg="$1"
            ensure_package "$pkg"

            OBS_FILES=$(curl -s -u "$OBS_USER:$OBS_PASS" "https://api.opensuse.org/source/home:ackerman/$pkg" | grep -oP '(?<=<entry name=")[^"]+' || true)

            for remote_file in $OBS_FILES; do
              # NEVER delete gitignored source artifacts (tarballs, vendor,
              # cargo_config, repacked RPMs/AppImages/...) when the local tree
              # lacks them AND the package cannot regenerate them server-side.
              # A package regenerates sources only via a _service with at least
              # one ENABLED service. Packages without _service (issue #8: sync
              # wiped niri-git TW sources it could not re-upload) and packages
              # whose services are all mode="disabled" (2026-09-09: the same
              # wipe hit matugen, whose obs_scm/cargo_vendor chain is disabled
              # and whose tarball+vendor+cargo_config then broke both distros)
              # would lose their sources permanently - keep the remote copies.
              regen=0
              if [ -f "$pkg/_service" ]; then
                total=$(grep -c '<service ' "$pkg/_service" || true)
                disabled=$(grep -c 'mode="disabled"' "$pkg/_service" || true)
                if [ "${total:-0}" -gt "${disabled:-0}" ]; then
                  regen=1
                fi
              fi
              if [ "$regen" != "1" ]; then
                case "$remote_file" in
                  *.tar.gz|*.tar.xz|*.tar.bz2|*.tar.zst|cargo_config|vendor*|*.rpm|*.AppImage|*.deb|*.keyring)
                    if [ ! -f "$pkg/$remote_file" ]; then
                      echo "    Keeping remote source artifact (no local copy to re-upload): $remote_file"
                      continue
                    fi
                    ;;
                esac
              fi
              if [ ! -f "$pkg/$remote_file" ] || [ "$remote_file" == "update.sh" ]; then
                echo "    Deleting obsolete file from OBS: $remote_file"
                curl -s -X DELETE -u "$OBS_USER:$OBS_PASS" "https://api.opensuse.org/source/home:ackerman/$pkg/$remote_file"
              fi
            done

            find "$pkg" -maxdepth 1 -type f ! -name "update.sh" ! -name ".*" | while read filepath; do
              filename=$(basename "$filepath")
              echo "    Uploading $filename to OBS..."
              curl -s -X PUT -u "$OBS_USER:$OBS_PASS" -T "$filepath" \
              "https://api.opensuse.org/source/home:ackerman/$pkg/$filename"
            done

            trigger_build "$pkg"
          }

          PKGS_TO_SYNC=$(collect_pkgs)

          # Reconcile repo-vs-OBS drift: if a previous run committed a version
          # bump but its OBS sync failed (e.g. transient API outage), the repo
          # stays ahead of OBS forever. Compare md5 of every git-tracked file
          # (spec/.changes/_service/patches...) against OBS and re-sync any
          # package that differs. Untracked generated artifacts (tarballs,
          # vendor.tar.xz) are intentionally ignored - they are produced by
          # update.sh / source services and differ harmlessly.
          echo "==> Checking repo-vs-OBS drift for tracked files..."
          expand_spec_macro() {
            # expand_spec_macro <spec> <text-with-%macros>  (one level per call)
            local spec="$1" val="$2" macro mval out
            macro=$(printf '%s' "$val" | grep -oP '%\{[a-zA-Z_][a-zA-Z0-9_]*\}|%[a-zA-Z_][a-zA-Z0-9_]*' | head -1 | tr -d '%{}') || true
            [ -n "$macro" ] || { printf '%s' "$val"; return; }
            mval=$(grep -oP "^%(?:global|define)\s+${macro}\s+\K\S+" "$spec" | head -1)
            if [ -z "$mval" ] && [ "${macro,,}" = "version" ]; then
              mval=$(grep -oP '^Version:[ \t]*\K\S+' "$spec" | head -1)
            fi
            if [ -n "$mval" ]; then
              out=$(printf '%s' "$val" | sed "s/%{${macro}}/${mval}/g; s/%${macro}/${mval}/g")
              printf '%s' "$out"
            else
              printf '%s' ""
            fi
          }
          for pkg_dir in */; do
            pkg="${pkg_dir%/}"
            ls "$pkg_dir"*.spec >/dev/null 2>&1 || continue
            spec_file=$(ls "$pkg_dir"*.spec | head -1)
            OBS_XML=$(curl -s -u "$OBS_USER:$OBS_PASS" "https://api.opensuse.org/source/home:ackerman/$pkg" || true)
            if echo "$OBS_XML" | grep -q 'unknown_package'; then
              PKGS_TO_SYNC="$PKGS_TO_SYNC $pkg"
              continue
            fi
            DRIFT=0
            while IFS= read -r filepath; do
              filename=$(basename "$filepath")
              [ "$filename" = "update.sh" ] && continue
              LOCAL_MD5=$(md5sum "$filepath" | cut -d' ' -f1)
              REMOTE_MD5=$(echo "$OBS_XML" | grep -oP "(?<=<entry name=\"$filename\" md5=\")[0-9a-f]{32}" | head -1 || true)
              if [ "$LOCAL_MD5" != "$REMOTE_MD5" ]; then
                echo " -> Drift on $pkg/$filename (local=$LOCAL_MD5 obs=${REMOTE_MD5:-missing})"
                DRIFT=1
                break
              fi
            done < <(git ls-files "$pkg")
            if [ "$DRIFT" != "1" ]; then
              continue
            fi
            # Safety: packages without _service get their sources uploaded from
            # the local tree. Only re-sync when every Source artifact is present
            # locally, otherwise the sync would DELETE the remote sources and
            # break the build. Skip such packages; a scheduled updater pass will
            # regenerate the artifacts and sync them properly.
            if [ ! -f "$pkg/_service" ]; then
              ART_OK=1
              while IFS= read -r srcline; do
                srcval=$(printf '%s' "$srcline" | sed 's/^[[:space:]]*Source[0-9]*:[[:space:]]*//')
                for _ in 1 2 3 4; do
                  expanded=$(expand_spec_macro "$spec_file" "$srcval")
                  [ -n "$expanded" ] || break
                  [ "$expanded" = "$srcval" ] && break
                  srcval="$expanded"
                done
                base=$(basename "$srcval")
                if [ -n "$base" ] && [ ! -f "$pkg/$base" ]; then
                  echo " -> $pkg: source artifact '$base' not in local tree; deferring drift-sync"
                  ART_OK=0
                  break
                fi
              done < <(grep -E '^[[:space:]]*Source[0-9]*:' "$spec_file")
              if [ "$ART_OK" != "1" ]; then
                continue
              fi
            fi
            PKGS_TO_SYNC="$PKGS_TO_SYNC $pkg"
          done

          for pkg in $PKGS_TO_SYNC; do
            if [ -z "$pkg" ] || [ ! -d "$pkg" ]; then
              continue
            fi
            echo " -> Syncing package: $pkg"
            sync_files "$pkg"
          done

          # Sync local packages that don't yet exist in OBS (new packages),
          # or that exist in OBS but have an empty source directory (e.g. a
          # package stub created by an earlier interrupted _meta PUT whose
          # file upload never completed -> OBS reports these as "broken").
          OBS_ALL_PKGS=$(curl -s -u "$OBS_USER:$OBS_PASS" "https://api.opensuse.org/source/home:ackerman" | grep -oP '(?<=<entry name=")[^"]+' || true)
          for pkg_dir in */; do
            pkg=$(basename "$pkg_dir")
            if [ ! -f "$pkg_dir"*.spec ] 2>/dev/null; then
              continue
            fi
            if echo "$OBS_ALL_PKGS" | grep -q "^${pkg}$"; then
              # Package already exists in OBS: only re-sync if its source
              # directory is empty (broken build due to missing files).
              OBS_FILES=$(curl -s -u "$OBS_USER:$OBS_PASS" "https://api.opensuse.org/source/home:ackerman/$pkg" | grep -oP '(?<=<entry name=")[^"]+' || true)
              if [ -n "$OBS_FILES" ]; then
                echo " -> OK, package $pkg already synced in OBS"
                continue
              fi
              echo " -> Package $pkg exists in OBS but has no files; re-syncing"
            else
              echo " -> New local package not in OBS: $pkg"
            fi
            sync_files "$pkg"
          done
