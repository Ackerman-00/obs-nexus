name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
      models: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.REPO_FULL_ACCESS_TOKEN || github.token }}

      - name: Configure git auth for pushes
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "41898282+opencode-agent[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.REPO_FULL_ACCESS_TOKEN || github.token }}@github.com/".insteadOf "https://github.com/"

      - name: Install opencode (v2, latest)
        shell: bash
        run: curl -fsSL https://opencode.ai/v2/install | bash

      - name: Build prompt from triggering issue/PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT: ${{ github.event.comment.body }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -n "$ISSUE_NUMBER" ]; then
            KIND="issue"
            NUMBER="$ISSUE_NUMBER"
            CONTEXT=$(gh issue view "$ISSUE_NUMBER" --json title,body,state,author --jq '"Author: \(.author.login)\nState: \(.state)\nTitle: \(.title)\n\n\(.body)"' 2>/dev/null || echo "(could not fetch issue)")
          else
            KIND="pull request"
            NUMBER="$PR_NUMBER"
            CONTEXT=$(gh pr view "$PR_NUMBER" --json title,body,state,author --jq '"Author: \(.author.login)\nState: \(.state)\nTitle: \(.title)\n\n\(.body)"' 2>/dev/null || echo "(could not fetch PR)")
          fi
          {
            echo "PROMPT<<PROMPT_EOF"
            printf 'You are the fully autonomous maintainer of opensuse-nexus (https://github.com/Ackerman-00/opensuse-nexus). A user invoked you with /oc. Handle %s #%s. The triggering comment was: %s\n\n--- CONTEXT ---\n%s\n--- END CONTEXT ---\n\nTASKS:\n1. INVESTIGATE: reproduce/diagnose the report. Web-search to verify every version, URL, and checksum - never trust the report or your memory alone.\n2. If it is a genuine packaging bug (missing dep, wrong version, broken OBS build/install, broken update.sh): fix the spec/.changes/update.sh directly, commit to main (git fetch origin && git pull --rebase origin main first), sync the package to OBS (OBS_USER/OBS_PASS) and trigger a rebuild, then verify the OBS build succeeds.\n3. If it is user error, already implemented, or a duplicate: say so clearly and kindly with evidence.\n4. ALWAYS leave a comment on %s #%d with your verdict and evidence (gh %s comment / gh %s close).\n5. NEVER create pull requests. Work directly on main. Never echo or paste any tokens.\n6. COMPLETION RECORD (MANDATORY): when done, never delete .opencode-relay.md; update it with your summary/evidence, set its status line to `status: complete`, add a `run_id: %d` line, and commit + push it. The workflow verifies the relay on main after you exit (status complete + this run_id); without it your run is treated as failed.\n7. GIT IDENTITY (MANDATORY - ONLY opencode-agent[bot], NOTHING ELSE): commit exclusively as opencode-agent[bot] <41898282+opencode-agent[bot]@users.noreply.github.com> (already set via git config and the GIT_AUTHOR_*/GIT_COMMITTER_* env vars). NEVER run git config user.name/user.email, NEVER pass --author/--committer, NEVER add Co-Authored-By or Signed-off-by trailers, NEVER invent or guess any noreply email. WHY: a past opencode run committed with an invented identity and GitHub attributed those commits to a real human account (OpenCode Apruzzese Francesco) - a stranger appeared as the author. After EVERY commit verify: git log -1 --format="%%an <%%ae>" must print exactly opencode-agent[bot] <41898282+opencode-agent[bot]@users.noreply.github.com> and git show -s --format=%%B HEAD | grep -ci co-authored must print 0. If a check fails: git commit --amend --reset-author --no-edit, re-verify, then git fetch origin && git pull --rebase origin main and push --force-with-lease. NEVER leave a misattributed commit on main.\n8. IN-APP UPDATERS (owner rule): strip Electron app-update.yml and package-type in the install recipe. Stamp-based apps (Hermes Agent Desktop) bake the stamp into app.asar at build time, so a strip cannot reach it: patch the shared payload build.sh before the build to force updateMechanism to external in apps/desktop/scripts/write-build-stamp.mjs and name the home:ackerman OBS owner in apps/desktop/electron/updater/external.ts, each with a fail-closed grep before the sed. One patch covers the Tumbleweed RPM and both Debian targets. A shipped desktop app that can self-update is NOT acceptable.\n9. TRUTH TOKENS (MANDATORY - the inline gate and tools/verify-opensuse.sh read .opencode-relay.md; a missing or stale token fails the run): write each as its own line: skills: <all fourteen ids from .opencode/skills> websearch: <N live queries, M primary-source URLs, YYYY-MM-DD>; why: <subject> - source: <commit | AGENTS.md#section | issue #N | relay run_id> - inference: <none | what you inferred>; improve: <N candidates, >= 5> - <top pick> - landed: <commit or issue #>; plan: <pkg> - <competing hypotheses and the probes run before changing it>; changed: <pkg ...>; deps: <pkg> - <official upstream build file or spec> plus the BuildRequires comparison; artifact: <pkg> - url: <...> format: <deb|rpm|tar|gnu|git> upstream-deps: <...> improvements: <...>; hunt: <category> - <what you ran>; defects-found: <N>; defects-fixed: <M>. Record at least 8 distinct hunt categories - a run with no hunt lines is incomplete. Every changed package needs a PASS row in the install-test table: a FAIL cell fails the run, EXTERNAL needs a GAP: external line naming that package, and a same-run install PASS beside a FAIL row is a contradiction that fails the run.\n10. GAP AND HOLD CLASSIFICATION (MANDATORY): every gap or HOLD is a line starting with the marker, classified as either GAP: external - <external thing that must change first, and why> [probe: <command output>] or GAP: actionable - <what you will fix>. An actionable marker FAILS the run - it means the work was yours and you did not do it. An external marker with no reason or no probe token fails the run. Classifying is not escaping: external is a claim you must PROVE with a command run this run. A bare heading ending in a colon, or prose that merely mentions the word gap, is not a declaration.\n11. NETWORK-ISOLATED OBS BUILDS - FULL AUTHORITY: OBS workers have no network. If a payload needs network during build, that is a pipeline design decision you own, not an external blocker (issue 35 ladybird-unstable). Build the payload on the Actions runner which HAS network, using a larger runner or cached dependency image if needed, upload a checksummed tarball to OBS with tools/obs-sync.sh, and let OBS repack offline - the hermes-agent-desktop pattern. Or vendor dependencies so OBS builds offline. Probe each path with a real command before writing GAP external or still-blocked; IF DECIDED, YOU HAVE FULL AUTHORITY to implement it end to end and close the issue only after all three targets build and install-test rows are PASS.\n12. NO WAITING FOR OWNER APPROVAL (MANDATORY): you are the owner of this repo. Never write needs-owner, waiting for owner, approval or permission language into the relay. Only a missing secret or a proven external outage is a GAP: external with a probe token and one tracking issue - never a request to a human.\n' \
              "$KIND" "$NUMBER" "$COMMENT" "$CONTEXT" "$KIND" "$NUMBER" "$KIND" "$KIND" "$RUN_ID"
            echo "PROMPT_EOF"
          } >> "$GITHUB_ENV"

      - name: Run opencode
        shell: bash
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          NOTES="$RUNNER_TEMP/cascade-notes.txt"
          mapfile -t CASCADE < <(bash tools/model-cascade.sh 2>"$NOTES") || true
          if [ "${#CASCADE[@]}" -eq 0 ]; then
            CASCADE=(opencode/deepseek-v4.1-flash-free)
          fi
          MODEL_NOTES="$(cat "$NOTES" 2>/dev/null || true)"
          echo "free-model cascade: ${CASCADE[*]}"
          [ -n "$MODEL_NOTES" ] && echo "$MODEL_NOTES"
          for model in "${CASCADE[@]}"; do
            echo "=== opencode run attempt with $model ==="
            exit_code=0
            model_skip=""
            for attempt_n in 1 2 3; do
              OCLOG="$RUNNER_TEMP/oc-out.txt"
              set -o pipefail
              if MODEL="$model" opencode run -m "$model" --dangerously-skip-permissions --agent=build --print-logs "$PROMPT" 2>&1 | tee "$OCLOG"; then
                exit_code=0
                set +o pipefail
                break
              fi
              exit_code=$?
              set +o pipefail
              if grep -qiE 'not available in (your|this) (country|region)|unavailable in (your|this) (country|region)' "$OCLOG" 2>/dev/null; then
                model_skip=region
                break
              fi
              if grep -qi 'free usage limit reached' "$OCLOG" 2>/dev/null; then
                model_skip=quota
                break
              fi
              if [ "$attempt_n" -lt 3 ]; then
                delay=$((RANDOM % (60 * attempt_n)))
                echo "=== $model try $attempt_n/3 failed (exit $exit_code) - backing off ${delay}s ==="
                sleep "$delay"
              fi
            done
            if [ "$model_skip" = "quota" ]; then
              echo "=== $model: free usage limit reached - moving to the next model ==="
              sleep 5
              continue
            fi
            if [ "$model_skip" = "region" ]; then
              echo "=== $model: not available in the runner region - skipping ==="
              continue
            fi
            if [ "$exit_code" -eq 0 ]; then
              git fetch origin main >/dev/null 2>&1
              if git show origin/main:.opencode-relay.md 2>/dev/null | grep -qx "run_id: $RUN_ID" && git show origin/main:.opencode-relay.md 2>/dev/null | grep -qi "status: complete"; then
                echo "=== $model completed (.opencode-relay.md on main confirms run $RUN_ID complete) ==="
                exit 0
              fi
              echo "=== $model exited 0 but .opencode-relay.md on main does not confirm run $RUN_ID complete - run is INCOMPLETE, treating as failure ==="
            else
              echo "=== attempt with $model failed 3/3 (exit $exit_code) - trying next ==="
            fi
            sleep 15
          done
          exit 1
        env:
          MODEL: opencode/deepseek-v4.1-flash-free
          OPENCODE_CONFIG_CONTENT: '{"agents":{"title":{"model":"opencode/deepseek-v4.1-flash-free"}},"websearch":{"provider":"random"}}'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASS: ${{ secrets.OBS_PASS }}
          RUN_ID: ${{ github.run_id }}
          GIT_AUTHOR_NAME: opencode-agent[bot]
          GIT_AUTHOR_EMAIL: 41898282+opencode-agent[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: opencode-agent[bot]
          GIT_COMMITTER_EMAIL: 41898282+opencode-agent[bot]@users.noreply.github.com

      - name: Verify completion (external)
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          bash tools/verify-opensuse.sh || { echo "::error::relay evidence incomplete"; exit 1; }